# Golden Gate: macOS 27 "Golden Gate" dark mode.
# Apple's dark-mode system colours with the system blue accent; window greys
# carry a faint indigo cast, the way macOS tints windows from the Golden Gate
# wallpaper. bright_* use the increased-contrast variants.
mode = "dark"

accent = "#0a84ff"
selection = "#3f638b"
selection_foreground = "#ffffff"
muted = "#8e8e93"

# Golden Gate's crisper glass: a brighter specular top-left edge fading out.
hyprland_active_border = "rgba(ffffff5c) rgba(c9ccff10) 135deg"
hyprland_inactive_border = "rgba(ffffff12)"

background = "#1c1b24"
dark_background = "#16151e"
darker_background = "#100f17"
lighter_background = "#2b2a35"

foreground = "#f5f5f7"
dark_foreground = "#98989d"
light_foreground = "#e5e5ea"
bright_foreground = "#ffffff"

red = "#ff453a"
yellow = "#ffd60a"
orange = "#ff9f0a"
green = "#30d158"
cyan = "#64d2ff"
blue = "#0a84ff"
magenta = "#bf5af2"
brown = "#ac8e68"

bright_red = "#ff6961"
bright_yellow = "#ffd426"
bright_green = "#31de4b"
bright_cyan = "#70d7ff"
bright_blue = "#409cff"
bright_magenta = "#da8fff"
