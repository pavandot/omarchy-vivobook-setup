normal-color        = "#f5f5f7"
normal-fill-alpha   = 0.06
normal-border       = "#ffffff"
normal-border-width = 1
normal-border-alpha = 0.12

hover-cursor-color        = "#f5f5f7"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#ffffff"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.18

focus-color        = "#f5f5f7"
focus-fill-alpha   = 0.10
focus-border       = "#0a84ff"
focus-border-width = 1
focus-border-alpha = 0.9

# macOS dark mode marks chosen segments, devices and slider tracks with a
# light graphite pill rather than accent blue; blue is kept for focus rings
# and menu selection.
selected-color        = "foreground"
selected-fill-alpha   = 0.20
selected-border       = "#ffffff"
selected-border-width = 0
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35
